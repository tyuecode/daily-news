# 每日热点简报站 v2：采集 → 生成 → 提交 → 部署（全部在一个 workflow 内）
# 注意：GITHUB_TOKEN 推送不会触发另一个工作流，所以生成和部署必须写在同一文件。
name: 每日热点简报

on:
  schedule:
    # UTC 0:00 / 6:00 / 12:00 = 北京时间 8:00 / 14:00 / 20:00
    - cron: '0 0,6,12 * * *'
  workflow_dispatch:

# 同一时刻只允许一个运行，且不取消正在运行的实例（避免半成品部署）
concurrency:
  group: pages
  cancel-in-progress: false

# 只需要写仓库内容：提交生成结果；不使用 GitHub Pages，故不需要 pages / id-token
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ── 仓库名守卫：绝对不允许碰用户主页仓库 tyuecode/tyuecode.github.io ──
      - name: 仓库名守卫
        run: |
          echo "当前仓库：$GITHUB_REPOSITORY"
          if [ "$GITHUB_REPOSITORY" != "tyuecode/daily-news" ]; then
            echo "错误：本工作流只允许在 tyuecode/daily-news 运行，已中止。"
            exit 1
          fi

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # ── 先跑运行时冒烟测试；失败立即中止，不带病上线 ──
      - name: 运行时冒烟测试
        run: python smoke_test.py

      # ── 生成今日简报；密钥只从 Secrets 注入环境变量，绝不写进代码或日志 ──
      - name: 生成今日简报
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_PAGES_PROJECT: ${{ secrets.CF_PAGES_PROJECT }}
        run: python scripts/generate.py

      - name: 配置 Git 身份
        run: |
          git config user.name "daily-news-v2-bot"
          git config user.email "bot@users.noreply.github.com"

      # ── 有变更才提交；generate.py 在闸门失败时不写文件，这里自然无变更 ──
      - name: 提交生成结果
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "没有变更，跳过提交。"
          else
            git commit -m "自动更新简报 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      # ── 准备站点目录：只放网页与数据，不暴露脚本/workflow ──
      - name: 准备站点文件
        run: |
          mkdir -p _site/archive _site/data _site/audio
          cp index.html _site/
          if [ -f robots.txt ]; then cp robots.txt _site/; fi
          cp -r archive/. _site/archive/
          cp -r data/. _site/data/
          if compgen -G "audio/*.mp3" > /dev/null; then cp audio/*.mp3 _site/audio/; fi

      # ── 部署到 Cloudflare Pages ──
      - name: 部署到 Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy _site --project-name=${{ secrets.CF_PAGES_PROJECT }} --branch=main
